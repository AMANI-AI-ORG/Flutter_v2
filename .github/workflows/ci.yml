name: CI

# Validations for the Flutter plugin. Also reused by release.yml via workflow_call
# so a release can never be published without passing the same checks.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.32.8"
  JAVA_VERSION: "17"

jobs:
  analyze:
    name: Analyze & package validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies (plugin + example)
        run: |
          flutter pub get
          (cd example && flutter pub get)

      # Existing code base has many legacy warnings/infos; only real errors fail the build.
      # Tighten to `flutter analyze` once the warnings are cleaned up.
      - name: Static analysis
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Unit tests
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No unit tests found (test/ missing) - skipping."
          fi

      - name: pub.dev package validation (dry-run)
        run: flutter pub publish --dry-run

  build-android:
    name: Build example (Android debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build debug APK
        working-directory: example
        run: |
          flutter pub get
          flutter build apk --debug

  build-ios:
    name: Build example (iOS, no codesign)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build iOS (no codesign)
        working-directory: example
        run: |
          flutter pub get
          flutter build ios --debug --no-codesign
