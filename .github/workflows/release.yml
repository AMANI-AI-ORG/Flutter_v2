name: Release

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate release pipeline without publishing
        type: boolean
        required: true
        default: true
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.32.8'

jobs:
  verify-release:
    name: Verify release configuration
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restrict manual runs to feat/v3 and validation-only
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          if [ "$GITHUB_REF_NAME" != 'feat/v3' ] || [ "$VALIDATE_ONLY" != 'true' ]; then
            echo '::error::Manual release runs require feat/v3 and validate_only=true.'
            exit 1
          fi
      - name: Validate version and tag
        id: version
        shell: bash
        run: |
          PUB_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d '"')"
          if [[ ! "$PUB_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected stable semver version in pubspec.yaml; found: $PUB_VERSION"
            exit 1
          fi
          echo "version=$PUB_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid release tag $GITHUB_REF_NAME"
              exit 1
            fi
            if [ "${GITHUB_REF_NAME#v}" != "$PUB_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $PUB_VERSION"
              exit 1
            fi
          fi
      - name: Require tagged commit on main
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo '::error::Tag commit must be reachable from main.'
            exit 1
          fi
      - name: Validate CHANGELOG
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo '::error::CHANGELOG.md is missing.'
            exit 1
          fi
          if ! grep -Eq "^##[[:space:]]+\[?${VERSION//./\.}\]?([[:space:]]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs a section for $VERSION"
            exit 1
          fi

  validate:
    name: Reuse all CI checks
    needs: verify-release
    uses: ./.github/workflows/ci.yml

  validation-summary:
    name: Validation only completed
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [verify-release, validate]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Release configuration and CI passed; no publication performed.'

  github-release:
    name: Create GitHub Release
    if: ${{ github.event_name == 'push' }}
    needs: [verify-release, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes
        shell: bash
        env:
          VERSION: ${{ needs.verify-release.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 == "## " v || $0 == "## [" v "]" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: false

  publish-pubdev:
    name: Publish to pub.dev
    if: ${{ github.event_name == 'push' && vars.PUBLISH_TO_PUBDEV == 'true' }}
    needs: [verify-release, validate, github-release]
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dart-lang/setup-dart@v1
      - name: Resolve dependencies
        run: flutter pub get
      - name: Publish
        run: dart pub publish --force
